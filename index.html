<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторная №5 — Введение в Vue</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 20px;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #ddd;
      border-radius: 5px;
      cursor: pointer;
    }
    button.active {
      background: #42b883;
      color: white;
    }
    .task {
      background: white;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    input, button {
      margin-top: 8px;
      padding: 6px;
    }
    ul {
      padding-left: 20px;
    }
  </style>
</head>
<body>
<div id="app">
  <h1>Лабораторная №5 — Введение в Vue</h1>

  <div class="tabs">
    <button
            v-for="(tab, i) in tabs"
            :key="i"
            :class="{ active: currentTab === i }"
            @click="currentTab = i"
    >
      Задание {{ i + 1 }}
    </button>
  </div>

  <div class="task">
    <component :is="tabs[currentTab]"></component>
  </div>
</div>

<script>
  const { createApp, ref, computed, defineComponent, watch, onMounted } = Vue

  const Task1 = defineComponent({
    setup() {
      const name = ref('Пользователь')
      return { name }
    },
    template: `
      <div>
        <input v-model="name" placeholder="Введите имя">
        <p>Привет, {{ name }}!</p>
      </div>
    `
  })

  const Task2 = defineComponent({
    setup() {
      const count = ref(0)
      return { count }
    },
    template: `
      <div>
        <p>Счётчик: {{ count }}</p>
        <button @click="count++">Увеличить</button>
      </div>
    `
  })

  const Task3 = defineComponent({
    setup() {
      const show = ref(true)
      return { show }
    },
    template: `
      <div>
        <button @click="show = !show">Показать/Скрыть описание</button>
        <p v-if="show">Это описание.</p>
      </div>
    `
  })

  const Task4 = defineComponent({
    setup() {
      const tasks = ref(['Сделать задание', 'Отправить отчёт', 'Отдохнуть'])
      return { tasks }
    },
    template: `
      <div>
        <ul>
          <li v-for="(t, i) in tasks" :key="i">{{ i + 1 }}. {{ t }}</li>
        </ul>
      </div>
    `
  })

  const Task5 = defineComponent({
    setup() {
      const name = ref('')
      const age = ref('')
      const people = ref([])
      function add() {
        if (name.value && age.value) {
          people.value.push({ name: name.value, age: age.value })
          name.value = ''
          age.value = ''
        }
      }
      return { name, age, people, add }
    },
    template: `
      <div>
        <form @submit.prevent="add">
          <input v-model="name" placeholder="Имя">
          <input v-model="age" placeholder="Возраст" type="number">
          <button>Добавить</button>
        </form>
        <ul>
          <li v-for="(p, i) in people" :key="i">{{ p.name }}, {{ p.age }}</li>
        </ul>
      </div>
    `
  })

  const Task6 = defineComponent({
    setup() {
      const num = ref(0)
      const square = computed(() => num.value ** 2)
      const cube = computed(() => num.value ** 3)
      return { num, square, cube }
    },
    template: `
      <div>
        <input v-model.number="num" type="number">
        <p>Число: {{ num }}</p>
        <p>Квадрат: {{ square }}</p>
        <p>Куб: {{ cube }}</p>
      </div>
    `
  })

  const Task7 = defineComponent({
    setup() {
      const time = ref(new Date().toLocaleTimeString())
      const greeting = ref('')
      onMounted(() => {
        setInterval(() => {
          time.value = new Date().toLocaleTimeString()
        }, 1000)
      })
      watch(time, () => {
        console.log('Время обновилось')
        const hour = new Date().getHours()
        if (hour < 12) greeting.value = 'Доброе утро'
        else if (hour < 18) greeting.value = 'Добрый день'
        else greeting.value = 'Добрый вечер'
      })
      return { time, greeting }
    },
    template: `
      <div>
        <p>{{ time }}</p>
        <p>{{ greeting }}</p>
      </div>
    `
  })

  createApp({
    setup() {
      const currentTab = ref(0)
      const tabs = [Task1, Task2, Task3, Task4, Task5, Task6, Task7]
      return { currentTab, tabs }
    }
  }).mount('#app')
</script>
</body>
</html>
